<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D91">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Placas">
<title>Leitor de placas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js" defer></script>
<style>
:root {
  --bg: #EDEFF2;
  --surface: #FFFFFF;
  --field: #F6F8FA;
  --ink: #10233F;
  --muted: #546174;
  --line: #D3D9E1;
  --accent: #0B3D91;
  --accent-ink: #FFFFFF;
  --chip: #E3EAF6;
  --chip-ink: #0B3D91;
  --danger: #B3261E;
  --ok: #1B6B43;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D141F; --surface: #152030; --field: #101A28; --ink: #E6ECF5; --muted: #9AA8BC;
    --line: #263447; --accent: #7FA8FF; --accent-ink: #0A1730; --chip: #1F3050; --chip-ink: #BBD2FF;
    --danger: #FF8A80; --ok: #6FD3A0; color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--body); -webkit-text-size-adjust: 100%;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 560px; margin: 0 auto; display: grid; gap: 28px;
  padding: 20px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));
}
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font: 600 34px/1.05 var(--display); letter-spacing: .01em; }
h2 { margin: 0; font: 600 24px/1.1 var(--display); letter-spacing: .01em; }
.sync { margin: 0; font-size: 13px; color: var(--muted); text-align: right; }

/* Escanear */
.scan { display: grid; gap: 12px; }
.cta {
  width: 100%; min-height: 68px; border: 0; border-radius: 14px;
  background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center; gap: 12px;
  font: 600 19px var(--body);
}
.cta:disabled { opacity: .45; cursor: not-allowed; }
.cta svg { width: 26px; height: 26px; flex: none; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.scan-alt { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.link {
  background: none; border: 0; padding: 10px 0; color: var(--accent);
  font-weight: 600; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap;
}
.manual { display: grid; gap: 6px; margin-top: 6px; }
.manual-row { display: flex; gap: 8px; }
.manual-row input { flex: 1; min-width: 0; }

label { font-weight: 600; font-size: 14px; }
input[type="text"], input[type="search"], textarea {
  width: 100%; border: 1px solid var(--line); background: var(--field);
  border-radius: 10px; padding: 12px 14px; font-size: 16px;
}
textarea { resize: vertical; min-height: 84px; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
.plate-input { font: 600 24px var(--display) !important; letter-spacing: .12em; text-transform: uppercase; }

.btn {
  min-height: 46px; padding: 0 18px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface);
  font-weight: 600; font-size: 15px;
}
.btn--primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn--danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Câmera ao vivo */
.viewer { display: grid; gap: 12px; }
.frame { position: relative; overflow: hidden; border-radius: 14px; background: #000; width: 100%; aspect-ratio: 3 / 4; }
.frame video { display: block; width: 100%; height: 100%; object-fit: cover; }
.guide {
  position: absolute; left: 8%; width: 84%; aspect-ratio: 3.2 / 1; top: 50%; transform: translateY(-50%);
  border: 3px solid #fff; border-radius: 10px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5);
  pointer-events: none;
}

/* Painel da placa lida */
.panel {
  display: grid; gap: 18px; padding: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
}
.panel-head { display: flex; align-items: flex-start; gap: 12px; }
.thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; background: var(--field); }
.status { margin: 0; flex: 1; min-height: 1.45em; font-size: 15px; }
.icon-btn {
  width: 40px; height: 40px; flex: none; border: 0; background: none;
  border-radius: 50%; font-size: 26px; line-height: 1; color: var(--muted);
}
.plate-holder { display: grid; place-items: center; padding: 6px 0; }
.field { display: grid; gap: 6px; }
.badge { margin: 0; font-size: 14px; color: var(--muted); min-height: 1.4em; }
.badge.is-known { color: var(--ok); font-weight: 500; }
.sub { margin: 8px 0 4px; font-size: 13px; color: var(--muted); }

.tags {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px;
  border: 1px solid var(--line); background: var(--field); border-radius: 10px;
}
.tags:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.tags input {
  flex: 1; min-width: 120px; border: 0; outline: 0; background: transparent;
  padding: 6px 4px; font-size: 16px;
}
.chips { display: contents; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 5px 6px 5px 12px;
  border-radius: 999px; border: 0; background: var(--chip); color: var(--chip-ink);
  font: 500 14px var(--body);
}
.chip__x {
  width: 24px; height: 24px; border: 0; border-radius: 50%; background: transparent;
  color: inherit; font-size: 18px; line-height: 1; padding: 0;
}
.chip--add { padding: 6px 12px; background: transparent; border: 1px dashed var(--line); color: var(--ink); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions .btn--primary { flex: 1; min-width: 150px; }
.msg { margin: 0; min-height: 1.4em; font-size: 14px; color: var(--ok); }
.msg.is-err { color: var(--danger); }

/* Placas salvas */
.saved { display: grid; gap: 14px; }
.saved-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.count { color: var(--muted); font-size: 14px; }
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row { border-bottom: 1px solid var(--line); }
.row-main {
  width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  padding: 14px 2px; background: none; border: 0; text-align: left;
}
.row-info { display: grid; gap: 4px; min-width: 0; }
.row-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-title.is-empty { color: var(--muted); font-weight: 400; }
.row-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.mini-tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--chip-ink); }
.row-meta { display: grid; gap: 2px; text-align: right; font-size: 12px; color: var(--muted); }
.empty { margin: 0; color: var(--muted); font-size: 15px; }

/* A placa */
.plate { container-type: inline-size; width: 100%; max-width: 320px; }
.plate--sm { width: 92px; flex: none; }
.plate__body {
  height: 34.5cqw; display: grid; grid-template-rows: minmax(0, 27fr) minmax(0, 73fr);
  border: .9cqw solid #15181C; border-radius: 4.2cqw; overflow: hidden; background: #F7F7F4;
}
.plate__band {
  display: grid; place-items: center; background: #0B3D91; color: #fff;
  font: 600 5.4cqw/1 var(--display); letter-spacing: .32em; padding-left: .32em;
}
.plate__chars {
  display: grid; place-items: center; color: #15181C; white-space: nowrap;
  font: 600 24cqw/1 var(--display); letter-spacing: .04em;
}
.plate--old .plate__body { background: #C4C8CD; }
.plate--old .plate__band { background: transparent; color: #15181C; }
.plate--ghost .plate__chars { opacity: .22; }
.plate--sm .plate__body { border-width: 1.5px; border-radius: 5px; }
.plate--sm .plate__band span { visibility: hidden; }
.plate.is-reading .plate__chars { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) {
  .plate.is-reading .plate__chars { animation: none; opacity: .5; }
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Leitor de placas</h1>
    <p class="sync">Dados só neste aparelho</p>
  </header>

  <section class="scan" aria-label="Ler uma placa">
    <button id="btn-cam" class="cta" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Ler placa com a câmera
    </button>
    <input id="in-file" type="file" accept="image/*" hidden>
    <div class="scan-alt">
      <p class="hint" id="scan-hint"></p>
      <button id="btn-file" class="link" type="button">Usar foto do aparelho</button>
    </div>
    <p id="scan-msg" class="msg" role="status"></p>
    <div class="manual">
      <label for="in-manual">Ou digite a placa</label>
      <div class="manual-row">
        <input id="in-manual" class="plate-input" type="text" maxlength="8" placeholder="ABC1D23" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
        <button id="btn-manual" class="btn" type="button">Buscar</button>
      </div>
    </div>
  </section>

  <section class="viewer" id="viewer" aria-label="Câmera" hidden>
    <div class="frame" id="frame">
      <video id="video" playsinline muted autoplay></video>
      <div class="guide" aria-hidden="true"></div>
    </div>
    <p class="hint">Encaixe a placa dentro da moldura, de frente e o mais perto que der.</p>
    <div class="actions">
      <button id="btn-shot" class="btn btn--primary" type="button">Capturar placa</button>
      <button id="btn-cancel" class="btn" type="button">Cancelar</button>
    </div>
  </section>

  <section class="panel" id="panel" aria-label="Placa selecionada" hidden>
    <div class="panel-head">
      <img id="thumb" class="thumb" alt="Foto da placa" hidden>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <button id="btn-close" class="icon-btn" type="button" aria-label="Fechar">×</button>
    </div>

    <div id="plate-holder" class="plate-holder"></div>

    <div class="field">
      <label for="f-plate">Placa</label>
      <input id="f-plate" class="plate-input" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <p id="badge" class="badge"></p>
      <div id="alts-wrap" hidden>
        <p class="sub">Outras leituras possíveis</p>
        <div id="alts" class="chips-row"></div>
      </div>
    </div>

    <div class="field">
      <label for="tag-in">Tags</label>
      <div class="tags" id="tags">
        <span id="tag-chips" class="chips"></span>
        <input id="tag-in" type="text" placeholder="Adicionar tag" enterkeyhint="done" autocomplete="off" autocapitalize="none" maxlength="40">
      </div>
      <div id="tag-sug-wrap" hidden>
        <p class="sub">Tags já usadas</p>
        <div id="tag-sug" class="chips-row"></div>
      </div>
    </div>

    <div class="field">
      <label for="f-vehicle">Veículo</label>
      <input id="f-vehicle" type="text" placeholder="Ex.: Onix branco" autocomplete="off" maxlength="120">
    </div>

    <div class="field">
      <label for="f-notes">Observações</label>
      <textarea id="f-notes" rows="3" maxlength="2000"></textarea>
    </div>

    <div class="actions">
      <button id="btn-save" class="btn btn--primary" type="button" disabled>Salvar placa</button>
      <button id="btn-del" class="btn btn--danger" type="button" hidden>Excluir</button>
    </div>
    <p id="panel-msg" class="msg" role="status"></p>
  </section>

  <section class="saved" aria-labelledby="saved-title">
    <div class="saved-head">
      <h2 id="saved-title">Placas salvas</h2>
      <span class="count" id="count"></span>
    </div>
    <input id="q" type="search" placeholder="Buscar por placa, tag ou veículo" autocomplete="off" aria-label="Buscar placas salvas">
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden></p>
    <div><button id="btn-export" class="link" type="button" hidden>Exportar placas em JSON</button></div>
    <p id="msg-list" class="msg" role="status"></p>
  </section>
</main>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
};

/* PURE:start — funções sem DOM (dá para testar no Node) */
const RE_VALID = /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/;
const RE_OLD = /^[A-Z]{3}[0-9]{4}$/;
const RE_NEW = /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/;
const norm = s => String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7);
const isValid = p => RE_VALID.test(p);
const L2D = { O: '0', Q: '0', D: '0', I: '1', L: '1', Z: '2', S: '5', G: '6', B: '8' };
const D2L = { '0': 'O', '1': 'I', '2': 'Z', '5': 'S', '6': 'G', '8': 'B' };
// Posições 1-3 são letras; 4, 6 e 7 são números. Corrige confusões comuns (O/0, I/1...).
function fixByPosition(p) {
  if (p.length !== 7) return p;
  return [...p].map((ch, i) => {
    if (i < 3) return D2L[ch] ?? ch;
    if (i === 3 || i >= 5) return L2D[ch] ?? ch;
    return ch;
  }).join('');
}
// Quantos caracteres estão na classe errada (letra onde devia ser número e vice-versa).
function mismatches(w) {
  let m = 0;
  for (let i = 0; i < 7; i++) {
    const isL = w[i] >= 'A' && w[i] <= 'Z', isD = w[i] >= '0' && w[i] <= '9';
    if (i < 3) { if (!isL) m++; } else if (i !== 4) { if (!isD) m++; }
  }
  return m;
}
// Procura placas plausíveis dentro de textos do OCR. Retorna Map(placa -> nº de correções).
function extractPlates(strings) {
  const out = new Map();
  for (const s of strings) {
    const t = String(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
    for (let i = 0; i + 7 <= t.length; i++) {
      const w = t.slice(i, i + 7), m = mismatches(w);
      if (m > 2) continue;
      const p = fixByPosition(w);
      if (!isValid(p)) continue;
      if (!out.has(p) || m < out.get(p)) out.set(p, m);
    }
  }
  return out;
}
function toGray(d) {
  const n = d.length / 4, g = new Uint8ClampedArray(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = (d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000;
  return g;
}
// Estica o contraste (ignora 2% mais escuros e 2% mais claros).
function stretch(g) {
  const h = new Uint32Array(256), n = g.length;
  for (let i = 0; i < n; i++) h[g[i]]++;
  let lo = 0, hi = 255, acc = 0;
  while (lo < 255 && (acc += h[lo]) < n * 0.02) lo++;
  acc = 0;
  while (hi > 0 && (acc += h[hi]) < n * 0.02) hi--;
  if (hi - lo < 20) return g;
  const out = new Uint8ClampedArray(n), s = 255 / (hi - lo);
  for (let i = 0; i < n; i++) out[i] = (g[i] - lo) * s;
  return out;
}
function otsu(g) {
  const h = new Uint32Array(256), n = g.length;
  for (let i = 0; i < n; i++) h[g[i]]++;
  let sum = 0; for (let t = 0; t < 256; t++) sum += t * h[t];
  let sB = 0, wB = 0, max = 0, th = 127;
  for (let t = 0; t < 256; t++) {
    wB += h[t]; if (!wB) continue;
    const wF = n - wB; if (!wF) break;
    sB += t * h[t];
    const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
    if (v > max) { max = v; th = t; }
  }
  return th;
}
// Preto e branco; garante texto escuro (minoria dos pixels) sobre fundo claro.
function binarize(g) {
  const t = otsu(g), out = new Uint8ClampedArray(g.length);
  let dark = 0;
  for (let i = 0; i < g.length; i++) { const v = g[i] > t ? 255 : 0; out[i] = v; if (!v) dark++; }
  if (dark > g.length / 2) for (let i = 0; i < out.length; i++) out[i] = 255 - out[i];
  return out;
}
function grayToRGBA(g, d) {
  for (let i = 0, j = 0; i < g.length; i++, j += 4) { d[j] = d[j + 1] = d[j + 2] = g[i]; d[j + 3] = 255; }
}
/* PURE:end */

/* ---------- Leitura local (reserva): Tesseract no navegador. Menos precisa que o serviço de placas. ---------- */
let workerP = null;
function getWorker() {
  if (!workerP) {
    workerP = (async () => {
      if (!window.Tesseract) throw Object.assign(new Error('lib'), { code: 'lib' });
      const w = await Tesseract.createWorker('eng', 1, { logger: m => { if (S.onOcr) S.onOcr(m); } });
      await w.setParameters({ tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', preserve_interword_spaces: '0' });
      return w;
    })().catch(e => { workerP = null; throw e; });
  }
  return workerP;
}

// Redimensiona, aplica contraste e (opcional) preto e branco, com margem branca ao redor.
// topCut descarta essa fração do topo (usado para tirar a tarja "BRASIL" do recorte).
function prep(src, kind, targetW, topCut = 0) {
  const sy = Math.round(src.height * topCut), sh = src.height - sy;
  const w = Math.round(targetW), h = Math.max(1, Math.round(sh * (w / src.width))), pad = 16;
  const cv = document.createElement('canvas'); cv.width = w + pad * 2; cv.height = h + pad * 2;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(src, 0, sy, src.width, sh, pad, pad, w, h);
  const img = ctx.getImageData(0, 0, cv.width, cv.height);
  let g = stretch(toGray(img.data));
  if (kind === 'otsu') g = binarize(g);
  grayToRGBA(g, img.data); ctx.putImageData(img, 0, 0);
  return cv;
}

// mode 'crop': recorte da moldura da câmera. mode 'full': foto inteira do aparelho.
async function readLocal(canvas, mode) {
  const w = await getWorker();
  // No recorte: recorte inteiro e "sem a tarja de cima", cada um em preto e branco e em tons de cinza.
  const variants = mode === 'crop'
    ? [prep(canvas, 'otsu', 480), prep(canvas, 'gray', 480), prep(canvas, 'otsu', 480, 0.34), prep(canvas, 'gray', 480, 0.34)]
    : [prep(canvas, 'gray', Math.min(canvas.width, 1600))];
  await w.setParameters({ tessedit_pageseg_mode: mode === 'crop' ? '7' : '6' });
  const seen = new Map();
  for (const v of variants) {
    const { data } = await w.recognize(v);
    const lines = String(data.text || '').split('\n'); lines.push(lines.join(''));
    for (const [p, m] of extractPlates(lines)) {
      const s = seen.get(p) || { n: 0, m: 9, conf: 0 };
      s.n++; s.m = Math.min(s.m, m); s.conf = Math.max(s.conf, data.confidence || 0);
      seen.set(p, s);
    }
  }
  let best = null, bestScore = -Infinity;
  for (const [p, s] of seen) {
    const score = s.n * 10 - s.m * 4 + s.conf / 100;
    if (score > bestScore) { best = { p, ...s }; bestScore = score; }
  }
  if (!best) return { plate: null };
  const confidence = best.m >= 2 || (best.conf > 0 && best.conf < 50) ? 'baixa' : (best.n >= 2 && best.m === 0 ? 'alta' : 'media');
  return { plate: best.p, confidence };
}

/* ---------- Leitura principal: serviço de placas, chamado pelo servidor (api/read-plate.js) ---------- */
const API_URL = 'api/read-plate';
const CODE_KEY = 'placas:codigo';
const apiError = (code, extra) => Object.assign(new Error(code), { code }, extra);
const API_NOTES = {
  no_backend: 'Sem servidor de leitura (abra pelo site publicado).',
  not_configured: 'O servidor ainda não tem a chave do serviço de leitura.',
  network: 'Sem conexão com o servidor de leitura.',
  rate_limited: 'Limite do serviço de leitura atingido.',
  too_large: 'A imagem ficou grande demais para o serviço.',
  upstream: 'O serviço de leitura falhou.',
};

async function callApi(canvas, retried = false) {
  const image = canvas.toDataURL('image/jpeg', 0.85);
  const headers = { 'Content-Type': 'application/json' };
  let code = ''; try { code = localStorage.getItem(CODE_KEY) || ''; } catch {}
  if (code) headers['x-access-code'] = code;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
  let res;
  try { res = await fetch(API_URL, { method: 'POST', headers, body: JSON.stringify({ image }), signal: ctl.signal }); }
  catch { throw apiError('network'); }
  finally { clearTimeout(timer); }
  let data = null; try { data = await res.json(); } catch {}
  if (res.status === 401) {
    try { localStorage.removeItem(CODE_KEY); } catch {}
    if (!retried) {
      const typed = window.prompt('Código de acesso do leitor:');
      if (typed && typed.trim()) { try { localStorage.setItem(CODE_KEY, typed.trim()); } catch {} return callApi(canvas, true); }
    }
    throw apiError('unauthorized');
  }
  if (res.status === 501) throw apiError('not_configured');
  if (res.status === 429) throw apiError('rate_limited');
  if (res.status === 413) throw apiError('too_large');
  if (!data || res.status === 404 || res.status === 405) throw apiError('no_backend');
  if (!res.ok) throw apiError('upstream', { detail: data.error });
  return data; // { plate, score, alternatives }
}

// Tenta o serviço de placas; se o servidor não estiver disponível, cai para a leitura local.
async function readPlate(frame, crop, mode) {
  let note = '';
  try {
    const d = await callApi(frame);
    const p = fixByPosition(norm(d.plate));
    const alts = (d.alternatives || []).map(norm).filter(a => isValid(a) && a !== p).slice(0, 3);
    if (!isValid(p)) return { plate: null, alts, engine: 'api' };
    const s = Number(d.score) || 0;
    return { plate: p, alts, engine: 'api', confidence: s >= 0.85 ? 'alta' : s >= 0.6 ? 'media' : 'baixa' };
  } catch (e) {
    if (e.code === 'unauthorized') throw e;
    note = API_NOTES[e.code] || API_NOTES.upstream;
  }
  const out = await readLocal(crop, mode);
  return { ...out, alts: [], engine: 'local', note };
}

/* ---------- Estado ---------- */
const S = { records: new Map(), cur: null, query: '', stream: null, onOcr: null };
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const rtf = new Intl.RelativeTimeFormat('pt-BR', { numeric: 'auto' });
function ago(ts) {
  if (!ts) return '';
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'agora';
  const m = s / 60; if (m < 60) return rtf.format(-Math.round(m), 'minute');
  const h = m / 60; if (h < 24) return rtf.format(-Math.round(h), 'hour');
  const d = Math.floor(h / 24); if (d < 30) return rtf.format(-d, 'day');
  if (d < 365) return rtf.format(-Math.floor(d / 30), 'month');
  return rtf.format(-Math.floor(d / 365), 'year');
}

/* ---------- Armazenamento (neste aparelho) ---------- */
const LS_KEY = 'placas:v1';
function loadLocal() {
  try {
    const arr = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    S.records = new Map(arr.filter(r => r && r.plate).map(r => [r.plate, r]));
  } catch { S.records = new Map(); }
}
function persistLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify([...S.records.values()])); return true; }
  catch { return false; }
}
function saveRecord(rec) {
  const prev = S.records.get(rec.plate);
  S.records.set(rec.plate, rec);
  if (!persistLocal()) {
    if (prev) S.records.set(rec.plate, prev); else S.records.delete(rec.plate);
    throw new Error('storage');
  }
  onRecords();
}
function deleteRecord(plate) {
  const prev = S.records.get(plate);
  S.records.delete(plate);
  if (!persistLocal()) { S.records.set(plate, prev); throw new Error('storage'); }
  onRecords();
}

/* ---------- Componentes ---------- */
function plateEl(raw, { small = false, reading = false } = {}) {
  const p = norm(raw);
  let kind = 'ghost', text = 'ABC1D23';
  if (RE_OLD.test(p)) { kind = 'old'; text = p.slice(0, 3) + '-' + p.slice(3); }
  else if (RE_NEW.test(p)) { kind = 'new'; text = p; }
  else if (p) { kind = 'partial'; text = p; }
  return el('div', {
    class: `plate plate--${kind}${small ? ' plate--sm' : ''}${reading ? ' is-reading' : ''}`,
    role: 'img', 'aria-label': p ? `Placa ${p}` : 'Placa ainda não lida',
  }, el('div', { class: 'plate__body' },
    el('div', { class: 'plate__band' }, el('span', { text: 'BRASIL' })),
    el('div', { class: 'plate__chars', text })));
}

const timers = {};
function flash(id, text, err = false) {
  const n = $(id); n.textContent = text; n.classList.toggle('is-err', err);
  clearTimeout(timers[id]); timers[id] = setTimeout(() => { n.textContent = ''; }, 5000);
}

/* ---------- Render ---------- */
const canLive = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext);
function renderScan() {
  $('btn-cam').disabled = !canLive();
  $('scan-hint').textContent = canLive()
    ? 'A câmera abre com uma moldura para a placa.'
    : 'A câmera ao vivo só funciona em página HTTPS. Use a foto do aparelho ou hospede este arquivo.';
}

function renderPanel() {
  const c = S.cur;
  $('panel').hidden = !c;
  if (!c) return;
  const img = $('thumb');
  if (c.photoUrl) { img.src = c.photoUrl; img.hidden = false; } else { img.removeAttribute('src'); img.hidden = true; }
  $('status').textContent = c.status || '';
  $('plate-holder').replaceChildren(plateEl(c.plate, { reading: c.reading }));

  const valid = isValid(c.plate);
  const rec = valid ? S.records.get(c.plate) : null;
  const b = $('badge');
  b.classList.toggle('is-known', !!rec);
  if (!c.plate) b.textContent = '';
  else if (!valid) b.textContent = 'A placa tem 7 caracteres: 3 letras, 1 número, 1 letra ou número e 2 números.';
  else if (rec) {
    const n = rec.seenCount || 1;
    b.textContent = `Já cadastrada. Lida ${n} ${n === 1 ? 'vez' : 'vezes'}` + (c.prevSeen ? `, última leitura ${ago(c.prevSeen)}.` : '.');
  } else b.textContent = 'Placa nova. Ainda não está salva.';

  const alts = (c.alts || []).filter(a => a !== c.plate);
  $('alts-wrap').hidden = !alts.length;
  $('alts').replaceChildren(...alts.map(a => el('button', { class: 'chip chip--add', type: 'button', onclick: () => setPlate(a) }, a)));

  $('btn-save').textContent = rec ? 'Salvar alterações' : 'Salvar placa';
  $('btn-save').disabled = !valid || c.reading;
  $('btn-del').hidden = !rec;
  $('btn-del').textContent = c.confirmDel ? 'Confirmar exclusão' : 'Excluir';
}

function chipEl(t) {
  return el('span', { class: 'chip' }, t,
    el('button', { class: 'chip__x', type: 'button', 'aria-label': `Remover tag ${t}`, onclick: () => removeTag(t) }, '×'));
}
function renderTags() {
  const c = S.cur; if (!c) return;
  $('tag-chips').replaceChildren(...c.tags.map(chipEl));
  const counts = new Map();
  for (const r of S.records.values()) for (const t of (r.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  const have = new Set(c.tags.map(t => t.toLowerCase()));
  const sug = [...counts].filter(([t]) => !have.has(t.toLowerCase())).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([t]) => t);
  $('tag-sug').replaceChildren(...sug.map(t => el('button', { class: 'chip chip--add', type: 'button', onclick: () => addTags([t]) }, '+ ' + t)));
  $('tag-sug-wrap').hidden = !sug.length;
}

function renderList() {
  const all = [...S.records.values()].sort((a, b) => (b.lastSeenAt || 0) - (a.lastSeenAt || 0));
  $('count').textContent = all.length ? `${all.length} ${all.length === 1 ? 'placa' : 'placas'}` : '';
  const q = S.query.trim().toLowerCase();
  const q2 = q.replace(/[-\s]/g, '');
  const items = !q ? all : all.filter(r => {
    const hay = [r.plate, r.vehicle, r.notes, ...(r.tags || [])].join(' ').toLowerCase();
    return hay.includes(q) || (q2 && hay.includes(q2));
  });
  $('list').replaceChildren(...items.map(r => {
    const n = r.seenCount || 1;
    const tags = (r.tags || []);
    const tagEls = tags.slice(0, 4).map(t => el('span', { class: 'mini-tag', text: t }));
    if (tags.length > 4) tagEls.push(el('span', { class: 'mini-tag', text: `+${tags.length - 4}` }));
    return el('li', { class: 'row' },
      el('button', { class: 'row-main', type: 'button', onclick: () => openFromList(r.plate) },
        plateEl(r.plate, { small: true }),
        el('span', { class: 'row-info' },
          el('span', { class: 'row-title' + (r.vehicle ? '' : ' is-empty'), text: r.vehicle || 'Sem descrição' }),
          tagEls.length ? el('span', { class: 'row-tags' }, tagEls) : null),
        el('span', { class: 'row-meta' },
          el('span', { text: `${n} ${n === 1 ? 'leitura' : 'leituras'}` }),
          el('span', { text: ago(r.lastSeenAt) }))));
  }));
  const empty = $('empty');
  if (!all.length) { empty.hidden = false; empty.textContent = 'Nenhuma placa salva ainda. Leia uma placa e salve para ela aparecer aqui.'; }
  else if (!items.length) { empty.hidden = false; empty.textContent = `Nada encontrado para “${S.query.trim()}”.`; }
  else empty.hidden = true;
  $('btn-export').hidden = !all.length;
}

function onRecords() {
  renderList();
  if (S.cur) { renderTags(); renderPanel(); }
}

/* ---------- Painel: abrir, preencher, limpar ---------- */
function fill(rec) {
  S.cur.tags = [...(rec.tags || [])];
  $('f-vehicle').value = rec.vehicle || '';
  $('f-notes').value = rec.notes || '';
  renderTags();
}
function clearForm() {
  S.cur.tags = [];
  $('f-vehicle').value = ''; $('f-notes').value = ''; $('tag-in').value = '';
  renderTags();
}
function startCur() {
  if (S.cur && S.cur.photoUrl) URL.revokeObjectURL(S.cur.photoUrl);
  S.cur = {
    plate: '', tags: [], photoUrl: null, reading: false, status: '',
    prevSeen: null, loadedFor: null, dirty: false, confirmDel: false, bumpedPlate: null, alts: [],
  };
  $('f-plate').value = ''; clearForm(); $('panel-msg').textContent = '';
  renderPanel();
  return S.cur;
}
function closePanel() {
  if (S.cur && S.cur.photoUrl) URL.revokeObjectURL(S.cur.photoUrl);
  S.cur = null; renderPanel();
}
function showEl(id) {
  $(id).scrollIntoView({ block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth' });
}
function setPlate(raw, { bump = false } = {}) {
  const c = S.cur; if (!c) return;
  const p = norm(raw);
  c.plate = p;
  if ($('f-plate').value !== p) $('f-plate').value = p;
  if (isValid(p) && p !== c.loadedFor) {
    const rec = S.records.get(p);
    if (rec) { fill(rec); c.loadedFor = p; c.prevSeen = rec.lastSeenAt || rec.updatedAt || null; c.dirty = false; }
    else if (c.loadedFor) { clearForm(); c.loadedFor = null; c.prevSeen = null; c.dirty = false; }
    else c.prevSeen = null;
  }
  if (bump && isValid(p) && c.bumpedPlate !== p && S.records.has(p)) {
    c.bumpedPlate = p;
    const cur = S.records.get(p);
    try { saveRecord({ ...cur, tags: [...(cur.tags || [])], seenCount: (cur.seenCount || 1) + 1, lastSeenAt: Date.now() }); } catch {}
  }
  renderPanel();
}
function openFromList(plate) {
  stopCamera(); startCur(); setPlate(plate); showEl('panel');
}

/* ---------- Tags ---------- */
function addTags(list) {
  const c = S.cur; if (!c) return;
  for (let t of list) {
    t = String(t).trim().replace(/^#+/, '').slice(0, 32);
    if (!t || c.tags.length >= 20) continue;
    if (c.tags.some(x => x.toLowerCase() === t.toLowerCase())) continue;
    c.tags.push(t); c.dirty = true;
  }
  renderTags();
}
function removeTag(t) {
  const c = S.cur; if (!c) return;
  c.tags = c.tags.filter(x => x !== t); c.dirty = true; renderTags();
}
function commitPendingTag() {
  const inp = $('tag-in');
  if (inp.value.trim()) addTags(inp.value.split(','));
  inp.value = '';
}

/* ---------- Câmera ao vivo ---------- */
function stopCamera() {
  if (S.stream) { S.stream.getTracks().forEach(t => t.stop()); S.stream = null; }
  $('video').srcObject = null;
  $('viewer').hidden = true;
}
function syncFrameRatio() {
  const v = $('video');
  if (v.videoWidth && v.videoHeight) $('frame').style.aspectRatio = `${v.videoWidth} / ${v.videoHeight}`;
}
async function openCamera() {
  if (!canLive()) { renderScan(); return; }
  closePanel(); stopCamera();
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
    });
  } catch (e) {
    flash('scan-msg', e && e.name === 'NotAllowedError'
      ? 'Permita o acesso à câmera nas configurações do navegador e tente de novo.'
      : 'Não consegui abrir a câmera. Use a foto do aparelho.', true);
    return;
  }
  const v = $('video');
  v.onloadedmetadata = syncFrameRatio; v.onresize = syncFrameRatio;
  v.srcObject = S.stream;
  try { await v.play(); } catch {}
  syncFrameRatio();
  $('viewer').hidden = false; showEl('viewer');
  getWorker().catch(() => {}); // já começa a baixar o leitor enquanto você enquadra
}

// Recorte = moldura + 6% de folga em volta.
function captureCrop() {
  const v = $('video'), vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return null;
  const gw = vw * 0.84, gh = gw / 3.2, m = gw * 0.06;
  const sx = Math.max(0, vw * 0.08 - m), sy = Math.max(0, (vh - gh) / 2 - m);
  const sw = Math.min(vw - sx, gw + 2 * m), sh = Math.min(vh - sy, gh + 2 * m);
  const cv = document.createElement('canvas'); cv.width = Math.round(sw); cv.height = Math.round(sh);
  cv.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  return cv;
}

// Quadro inteiro da câmera (até 1280 px): o serviço de placas acha a placa sozinho.
function captureFrame() {
  const v = $('video'), vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return null;
  const sc = Math.min(1, 1280 / Math.max(vw, vh));
  const cv = document.createElement('canvas'); cv.width = Math.round(vw * sc); cv.height = Math.round(vh * sc);
  cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
  return cv;
}

function readError(e) {
  if (e && e.code === 'unauthorized') return 'Código de acesso inválido. Toque em ler de novo e informe o código certo.';
  if (e && e.code === 'lib') return 'Não consegui carregar o leitor. Ele precisa de internet na primeira vez. Digite a placa abaixo.';
  return 'Não deu para ler agora. Tente de novo ou digite a placa.';
}

async function runRead(frame, crop, mode) {
  const c = startCur();
  c.reading = true; c.status = 'Lendo a placa…'; renderPanel(); showEl('panel');
  frame.toBlob(b => {
    if (!b || S.cur !== c) return;
    c.photoUrl = URL.createObjectURL(b); renderPanel();
  }, 'image/jpeg', 0.85);
  S.onOcr = m => {
    if (S.cur === c && c.reading && m && /loading/i.test(m.status || '')) {
      $('status').textContent = 'Baixando o leitor local, só na primeira vez…';
    }
  };
  try {
    const out = await readPlate(frame, crop, mode);
    if (S.cur !== c) return;
    c.reading = false;
    const local = out.engine === 'local' ? ` ${out.note} Usei a leitura do aparelho, que é menos precisa.` : '';
    if (out.plate) {
      c.alts = [out.plate, ...(out.alts || [])];
      c.status = (out.confidence === 'baixa'
        ? 'Leitura incerta. Confira cada caractere antes de salvar.'
        : 'Placa lida. Confira os caracteres antes de salvar.') + local;
      setPlate(out.plate, { bump: true });
    } else {
      c.alts = out.alts || [];
      c.status = 'Não encontrei uma placa legível. Aproxime, evite reflexo e tente de novo, ou digite a placa.' + local;
      renderPanel();
    }
  } catch (e) {
    if (S.cur !== c) return;
    c.reading = false; c.status = readError(e); renderPanel();
  } finally { S.onOcr = null; }
}

function onShot() {
  const frame = captureFrame(), crop = captureCrop();
  if (!frame || !crop) return;
  stopCamera();
  runRead(frame, crop, 'crop');
}

async function onFile(file) {
  stopCamera();
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.naturalWidth * sc)); cv.height = Math.max(1, Math.round(img.naturalHeight * sc));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    runRead(cv, cv, 'full');
  } catch {
    flash('scan-msg', 'Não consegui abrir essa foto. Tente outra.', true);
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Salvar, excluir, exportar ---------- */
function onSave() {
  const c = S.cur;
  if (!c || !isValid(c.plate)) return;
  commitPendingTag();
  const prev = S.records.get(c.plate), now = Date.now();
  try {
    saveRecord({
      plate: c.plate, tags: [...c.tags],
      vehicle: $('f-vehicle').value.trim(), notes: $('f-notes').value.trim(),
      createdAt: (prev && prev.createdAt) || now, updatedAt: now,
      lastSeenAt: (prev && prev.lastSeenAt) || now, seenCount: (prev && prev.seenCount) || 1,
    });
    c.loadedFor = c.plate; c.dirty = false;
    flash('panel-msg', 'Placa salva.');
  } catch {
    flash('panel-msg', 'Não foi possível salvar. O navegador pode estar bloqueando o armazenamento (aba anônima?).', true);
  }
}

function onDelete() {
  const c = S.cur;
  if (!c || !S.records.has(c.plate)) return;
  if (!c.confirmDel) {
    c.confirmDel = true; renderPanel();
    setTimeout(() => { if (S.cur === c && c.confirmDel) { c.confirmDel = false; renderPanel(); } }, 4000);
    return;
  }
  try { deleteRecord(c.plate); closePanel(); flash('msg-list', 'Placa excluída.'); }
  catch { c.confirmDel = false; renderPanel(); flash('panel-msg', 'Não foi possível excluir. Tente de novo.', true); }
}

function onExport() {
  const data = JSON.stringify([...S.records.values()].sort((a, b) => a.plate.localeCompare(b.plate)), null, 2);
  const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const a = el('a', { href: url, download: 'placas.json' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  flash('msg-list', 'Arquivo gerado.');
}

/* ---------- Eventos ---------- */
$('btn-cam').addEventListener('click', openCamera);
$('btn-cancel').addEventListener('click', stopCamera);
$('btn-shot').addEventListener('click', onShot);
$('btn-file').addEventListener('click', () => $('in-file').click());
$('in-file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (f) onFile(f);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); });

function lookupManual() {
  const p = norm($('in-manual').value);
  if (!p) { $('in-manual').focus(); return; }
  stopCamera(); startCur(); setPlate(p);
  $('in-manual').value = ''; showEl('panel');
}
$('btn-manual').addEventListener('click', lookupManual);
$('in-manual').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lookupManual(); } });

$('f-plate').addEventListener('input', e => setPlate(e.target.value));
$('f-vehicle').addEventListener('input', () => { if (S.cur) S.cur.dirty = true; });
$('f-notes').addEventListener('input', () => { if (S.cur) S.cur.dirty = true; });
$('tags').addEventListener('click', e => { if (e.target === $('tags')) $('tag-in').focus(); });
$('tag-in').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); commitPendingTag(); }
  else if (e.key === 'Backspace' && !$('tag-in').value && S.cur && S.cur.tags.length) {
    S.cur.tags.pop(); S.cur.dirty = true; renderTags();
  }
});
$('tag-in').addEventListener('input', e => { if (e.target.value.includes(',')) commitPendingTag(); });
$('tag-in').addEventListener('blur', commitPendingTag);

$('btn-save').addEventListener('click', onSave);
$('btn-del').addEventListener('click', onDelete);
$('btn-close').addEventListener('click', closePanel);
$('q').addEventListener('input', e => { S.query = e.target.value; renderList(); });
$('btn-export').addEventListener('click', onExport);

/* ---------- Início ---------- */
loadLocal();
renderScan();
renderList();
})();
</script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strike Details">
<title>Strike Details | Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js" defer></script>
<style>
:root {
  --bg: #F2F2F1;
  --surface: #FFFFFF;
  --soft: #F7F7F6;
  --ink: #121212;
  --ink-2: #3B3B3B;
  --muted: #6F6F6F;
  --line: #E2E2E0;
  --line-2: #CDCDCA;
  --primary: #121212;
  --primary-ink: #FFFFFF;
  --warn: #9A5B00;
  --warn-bg: #FFF3DC;
  --danger: #B42318;
  --danger-bg: #FDECEA;
  --ok: #1D6B40;
  --brand: "Archivo Black", "Arial Black", sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 64px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
img { display: block; max-width: 100%; }

/* ---------- Estrutura ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
}
.topbar-in { max-width: 1040px; margin: 0 auto; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wordmark { font: 400 17px/1 var(--brand); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who-name { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-name b { color: var(--ink); font-weight: 600; }
.link-btn { border: 0; background: none; padding: 8px 2px; font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

main {
  max-width: 1040px; margin: 0 auto;
  padding: 20px max(16px, env(safe-area-inset-right)) calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left));
}
main.no-nav { padding-bottom: 48px; }
.stack { display: grid; gap: 16px; }
.stack-lg { display: grid; gap: 28px; }

h1 { margin: 0; font: 700 30px/1.05 var(--cond); letter-spacing: .01em; }
h2 { margin: 0; font: 700 21px/1.1 var(--cond); letter-spacing: .01em; }
h3 { margin: 0; font: 600 15px/1.3 var(--body); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.count { color: var(--muted); font-size: 14px; white-space: nowrap; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; color: var(--muted); font-weight: 600; font-size: 14px; }
.back svg { width: 18px; height: 18px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* ---------- Navegação inferior ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left));
}
.nav-in { max-width: 640px; margin: 0 auto; height: var(--nav-h); display: flex; align-items: center; justify-content: space-around; gap: 4px; }
.nav a {
  flex: 1; display: grid; justify-items: center; gap: 3px; padding: 6px 2px; border-radius: 10px;
  color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600;
}
.nav a svg { width: 22px; height: 22px; }
.nav a[aria-current="page"] { color: var(--ink); }
.nav a.nav-scan { color: var(--primary-ink); }
.nav a.nav-scan span.pill { display: grid; place-items: center; width: 52px; height: 36px; border-radius: 999px; background: var(--primary); }
.nav a.nav-scan span.lbl { color: var(--ink); }
.nav a.has-alert { position: relative; }
.nav a.has-alert::after { content: ""; position: absolute; top: 5px; left: calc(50% + 7px); width: 9px; height: 9px; border-radius: 50%; background: #D97706; box-shadow: 0 0 0 2px var(--surface); }

/* ---------- Formulários ---------- */
label, .label { font-weight: 600; font-size: 13px; color: var(--ink-2); }
.field { display: grid; gap: 6px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
input[type="text"], input[type="search"], select, textarea {
  width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 11px 12px; font-size: 16px;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
textarea { resize: vertical; min-height: 76px; }
::placeholder { color: #9A9A98; }
.plate-input { font: 700 24px var(--cond) !important; letter-spacing: .12em; text-transform: uppercase; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface);
  font-weight: 600; font-size: 15px; text-decoration: none; color: var(--ink);
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn--primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn--danger { color: var(--danger); border-color: #EBC4BF; }
.btn--block { width: 100%; }
.btn--lg { min-height: 56px; font-size: 16px; }
.btn--sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions > .grow { flex: 1; min-width: 160px; }

.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font: 600 12px/1.4 var(--body); background: var(--soft); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag--dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.tag--warn { background: var(--warn-bg); border-color: #F1D5A3; color: var(--warn); }
.tag--danger { background: var(--danger-bg); border-color: #F2C3BD; color: var(--danger); }
.tag--ok { background: #E8F3EC; border-color: #BFDCC9; color: var(--ok); }

.alert { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--warn-bg); border: 1px solid #F1D5A3; color: var(--warn); font-size: 14px; font-weight: 500; text-decoration: none; }
.alert b { font-weight: 700; }
.alert svg { width: 18px; height: 18px; flex: none; }
.empty { margin: 0; padding: 36px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 14px; background: var(--surface); }

/* ---------- Login ---------- */
.login { min-height: 100dvh; display: grid; align-content: center; justify-items: center; padding: 32px 16px; }
.login-box { width: 100%; max-width: 420px; display: grid; gap: 24px; }
.login-brand { display: grid; gap: 6px; }
.login-brand .wordmark { font-size: 30px; line-height: 1.05; white-space: normal; }
.login-brand p { margin: 0; color: var(--muted); }
.choice {
  width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; color: var(--ink); text-decoration: none;
  padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
}
.choice:hover { border-color: var(--line-2); }
.choice-ico { width: 44px; height: 44px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.choice-ico svg { width: 22px; height: 22px; }
.choice-txt { display: grid; gap: 2px; flex: 1; }
.choice-txt b { font-size: 16px; }
.choice-txt span { font-size: 13px; color: var(--muted); }
.choice-go { color: var(--muted); }
.choice.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.choice.dark .choice-ico { background: #2A2A2A; border-color: #3A3A3A; }
.choice.dark .choice-txt span, .choice.dark .choice-go { color: #BDBDBD; }
.people { display: grid; gap: 8px; }
.login-note { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }

/* ---------- Galeria ---------- */
.gallery { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); }
@media (min-width: 720px) { .gallery { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; } }
.car {
  width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr; text-align: left; padding: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.car:hover { border-color: var(--line-2); }
.car-photo { aspect-ratio: 4 / 3; background: var(--soft); position: relative; overflow: hidden; }
.car-photo img { width: 100%; height: 100%; object-fit: cover; }
.car-photo .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #B5B5B2; }
.car-photo .ph svg { width: 44px; height: 44px; }
.car-body { padding: 10px 12px 12px; display: grid; gap: 6px; align-content: start; }
.car-plate { font: 700 21px/1 var(--cond); letter-spacing: .08em; }
.car-desc { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.car-stage { font-size: 13px; font-weight: 600; }
.bar { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); }

.search { position: relative; }
.search input { padding-left: 38px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }

/* ---------- Placa ---------- */
.plate { container-type: inline-size; width: 100%; max-width: 300px; }
.plate__body { height: 34.5cqw; display: grid; grid-template-rows: minmax(0, 27fr) minmax(0, 73fr); border: .9cqw solid #151515; border-radius: 4.2cqw; overflow: hidden; background: #FAFAF8; }
.plate__band { display: grid; place-items: center; background: #1C1C1C; color: #fff; font: 600 5.4cqw/1 var(--cond); letter-spacing: .32em; padding-left: .32em; }
.plate__chars { display: grid; place-items: center; color: #151515; white-space: nowrap; font: 700 24cqw/1 var(--cond); letter-spacing: .04em; }
.plate--old .plate__body { background: #C9CBCD; }
.plate--old .plate__band { background: transparent; color: #151515; }
.plate--ghost .plate__chars { opacity: .2; }
.plate.is-reading .plate__chars { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .plate.is-reading .plate__chars { animation: none; opacity: .5; } }
.plate-center { display: grid; place-items: center; }

/* ---------- Leitor ---------- */
.frame { position: relative; overflow: hidden; border-radius: 14px; background: #000; width: 100%; aspect-ratio: 3 / 4; }
.frame video { display: block; width: 100%; height: 100%; object-fit: cover; }
.guide { position: absolute; left: 8%; width: 84%; aspect-ratio: 3.2 / 1; top: 50%; transform: translateY(-50%); border: 3px solid #fff; border-radius: 10px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5); pointer-events: none; }
.status { margin: 0; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px dashed var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 12px; font: 700 15px var(--cond); letter-spacing: .08em; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---------- Veículo ---------- */
.veh-head { display: grid; gap: 4px; }
.veh-plate { font: 700 38px/1 var(--cond); letter-spacing: .08em; }
.veh-sub { color: var(--muted); font-size: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; }
.step { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: start; padding: 10px 0; position: relative; }
.step + .step { border-top: 1px solid var(--line); }
.step-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; background: var(--surface); }
.step-dot svg { width: 14px; height: 14px; }
.step.is-done .step-dot { background: var(--ink); border-color: var(--ink); color: #fff; }
.step.is-current .step-dot { border-color: var(--ink); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 10px var(--ink); }
.step-name { font-weight: 600; padding-top: 2px; }
.step.is-todo .step-name { color: var(--muted); font-weight: 500; }
.step-when { font-size: 12px; color: var(--muted); padding-top: 4px; text-align: right; }

.photos { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.photo { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: var(--soft); border: 1px solid var(--line); }
.photo button.open { position: absolute; inset: 0; border: 0; padding: 0; background: none; }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 5px; font-size: 11px; font-weight: 600; color: #fff; background: linear-gradient(transparent, rgba(0, 0, 0, .65)); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.photo .rm { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .6); color: #fff; font-size: 16px; line-height: 1; display: grid; place-items: center; }
.slot { aspect-ratio: 1; border-radius: 10px; border: 1.5px dashed var(--line-2); background: var(--surface); display: grid; place-items: center; align-content: center; gap: 4px; padding: 6px; text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-2); width: 100%; }
.slot svg { width: 22px; height: 22px; color: var(--muted); }
.slot.is-extra { border-style: solid; background: var(--soft); }

.kv { display: grid; gap: 10px; margin: 0; }
.kv div { display: grid; gap: 2px; }
.kv dt { font-size: 12px; font-weight: 600; color: var(--muted); }
.kv dd { margin: 0; white-space: pre-wrap; }

.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.log li { display: flex; justify-content: space-between; gap: 12px; }
.log li span:last-child { color: var(--muted); text-align: right; white-space: nowrap; }

/* ---------- Estoque ---------- */
.stock { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; }
.item.is-low { border-color: #E6C48A; }
.item.is-out { border-color: #E9B2AA; }
.item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.item-name { font-weight: 600; font-size: 16px; }
.item-min { font-size: 12px; color: var(--muted); }
.item-qty { font: 700 40px/1 var(--cond); text-align: right; white-space: nowrap; }
.item-qty small { font: 500 14px var(--body); color: var(--muted); margin-left: 4px; }
.item-last { font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 46px; height: 46px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-size: 22px; line-height: 1; flex: none; }
.stepper input { text-align: center; font: 700 22px var(--cond) !important; }
.inline-form { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

/* ---------- Listas simples ---------- */
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.rows > li + li { border-top: 1px solid var(--line); }
.r { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: 0; text-align: left; }
.r-thumb { width: 56px; height: 44px; border-radius: 8px; overflow: hidden; background: var(--soft); flex: none; }
.r-thumb img { width: 100%; height: 100%; object-fit: cover; }
.r-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.r-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-side { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.r-plate { font: 700 18px var(--cond); letter-spacing: .08em; }

.etapas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.etapas li { display: flex; align-items: center; gap: 6px; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 10px; }
.etapas li .n { font: 700 14px var(--cond); color: var(--muted); width: 1.4em; }
.etapas li .t { flex: 1; font-size: 14px; }
.icon-btn { width: 34px; height: 34px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); display: grid; place-items: center; font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--line); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- Cliente ---------- */
.client { max-width: 640px; margin: 0 auto; }
.client-hero { display: grid; gap: 8px; }
.client-hero p { margin: 0; color: var(--muted); }
.status-big { display: grid; gap: 8px; padding: 18px; border-radius: 14px; background: var(--ink); color: #fff; }
.status-big .k { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: #BDBDBD; }
.status-big .v { font: 700 30px/1.05 var(--cond); }
.status-big .bar { background: #3A3A3A; }
.status-big .bar > i { background: #fff; }

/* ---------- Diálogos e aviso ---------- */
dialog.viewer { border: 0; padding: 0; background: #000; max-width: 100vw; max-height: 100dvh; width: 100vw; height: 100dvh; }
dialog.viewer::backdrop { background: rgba(0, 0, 0, .9); }
.viewer-in { width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr; }
.viewer-bar { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; color: #fff; }
.viewer-bar button { border: 0; background: none; color: #fff; font-weight: 600; font-size: 15px; padding: 8px; }
.viewer-img { display: grid; place-items: center; overflow: hidden; }
.viewer-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  max-width: calc(100vw - 32px); padding: 12px 16px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 500;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
}
.toast.is-err { background: var(--danger); }
body.no-nav .toast { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
</style>
</head>
<body>
<div id="app"></div>
<input id="file-photo" type="file" accept="image/*" hidden>
<input id="file-plate" type="file" accept="image/*" hidden>
<dialog id="viewer" class="viewer" aria-label="Foto">
  <div class="viewer-in">
    <div class="viewer-bar"><span id="viewer-cap"></span><button id="viewer-close" type="button">Fechar</button></div>
    <div class="viewer-img"><img id="viewer-img" alt=""></div>
  </div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Utilitários
   ===================================================================== */
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;

const RE_VALID = /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/;

/* ---------- Leitura local (reserva): Tesseract no navegador ---------- */
let workerP = null;
function getWorker() {
  if (!workerP) {
    workerP = (async () => {
      if (!window.Tesseract) throw Object.assign(new Error('lib'), { code: 'lib' });
      const w = await Tesseract.createWorker('eng', 1, { logger: m => { if (S.onOcr) S.onOcr(m); } });
      await w.setParameters({ tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', preserve_interword_spaces: '0' });
      return w;
    })().catch(e => { workerP = null; throw e; });
  }
  return workerP;
}
function prep(src, kind, targetW, topCut = 0) {
  const sy = Math.round(src.height * topCut), sh = src.height - sy;
  const w = Math.round(targetW), h = Math.max(1, Math.round(sh * (w / src.width))), pad = 16;
  const cv = document.createElement('canvas'); cv.width = w + pad * 2; cv.height = h + pad * 2;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(src, 0, sy, src.width, sh, pad, pad, w, h);
  const img = ctx.getImageData(0, 0, cv.width, cv.height);
  let g = stretch(toGray(img.data));
  if (kind === 'otsu') g = binarize(g);
  grayToRGBA(g, img.data); ctx.putImageData(img, 0, 0);
  return cv;
}
async function readLocal(canvas, mode) {
  const w = await getWorker();
  const variants = mode === 'crop'
    ? [prep(canvas, 'otsu', 480), prep(canvas, 'gray', 480), prep(canvas, 'otsu', 480, 0.34), prep(canvas, 'gray', 480, 0.34)]
    : [prep(canvas, 'gray', Math.min(canvas.width, 1600))];
  await w.setParameters({ tessedit_pageseg_mode: mode === 'crop' ? '7' : '6' });
  const seen = new Map();
  for (const v of variants) {
    const { data } = await w.recognize(v);
    const lines = String(data.text || '').split('\n'); lines.push(lines.join(''));
    for (const [p, m] of extractPlates(lines)) {
      const s = seen.get(p) || { n: 0, m: 9, conf: 0 };
      s.n++; s.m = Math.min(s.m, m); s.conf = Math.max(s.conf, data.confidence || 0);
      seen.set(p, s);
    }
  }
  let best = null, bestScore = -Infinity;
  for (const [p, s] of seen) {
    const score = s.n * 10 - s.m * 4 + s.conf / 100;
    if (score > bestScore) { best = { p, ...s }; bestScore = score; }
  }
  if (!best) return { plate: null };
  const confidence = best.m >= 2 || (best.conf > 0 && best.conf < 50) ? 'baixa' : (best.n >= 2 && best.m === 0 ? 'alta' : 'media');
  return { plate: best.p, confidence };
}

/* ---------- Leitura principal: serviço de placas via api/read-plate (sem mudanças) ---------- */
const API_URL = 'api/read-plate';
const CODE_KEY = 'placas:codigo';
const apiError = (code, extra) => Object.assign(new Error(code), { code }, extra);
const API_NOTES = {
  no_backend: 'Sem servidor de leitura (abra pelo site publicado ou pelo servidor local).',
  not_configured: 'O servidor ainda não tem a chave do serviço de leitura.',
  network: 'Sem conexão com o servidor de leitura.',
  rate_limited: 'Limite do serviço de leitura atingido.',
  too_large: 'A imagem ficou grande demais para o serviço.',
  upstream: 'O serviço de leitura falhou.',
};
async function callApi(canvas, retried = false) {
  const image = canvas.toDataURL('image/jpeg', 0.85);
  const headers = { 'Content-Type': 'application/json' };
  let code = ''; try { code = localStorage.getItem(CODE_KEY) || ''; } catch {}
  if (code) headers['x-access-code'] = code;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
  let res;
  try { res = await fetch(API_URL, { method: 'POST', headers, body: JSON.stringify({ image }), signal: ctl.signal }); }
  catch { throw apiError('network'); }
  finally { clearTimeout(timer); }
  let data = null; try { data = await res.json(); } catch {}
  if (res.status === 401) {
    try { localStorage.removeItem(CODE_KEY); } catch {}
    if (!retried) {
      const typed = window.prompt('Código de acesso do leitor:');
      if (typed && typed.trim()) { try { localStorage.setItem(CODE_KEY, typed.trim()); } catch {} return callApi(canvas, true); }
    }
    throw apiError('unauthorized');
  }
  if (res.status === 501) throw apiError('not_configured');
  if (res.status === 429) throw apiError('rate_limited');
  if (res.status === 413) throw apiError('too_large');
  if (!data || res.status === 404 || res.status === 405) throw apiError('no_backend');
  if (!res.ok) throw apiError('upstream', { detail: data.error });
  return data;
}
async function readPlate(frame, crop, mode) {
  let note = '';
  try {
    const d = await callApi(frame);
    const p = fixByPosition(norm(d.plate));
    const alts = (d.alternatives || []).map(norm).filter(a => isValid(a) && a !== p).slice(0, 3);
    if (!isValid(p)) return { plate: null, alts, engine: 'api' };
    const s = Number(d.score) || 0;
    return { plate: p, alts, engine: 'api', confidence: s >= 0.85 ? 'alta' : s >= 0.6 ? 'media' : 'baixa' };
  } catch (e) {
    if (e.code === 'unauthorized') throw e;
    note = API_NOTES[e.code] || API_NOTES.upstream;
  }
  const out = await readLocal(crop, mode);
  return { ...out, alts: [], engine: 'local', note };
}

let idbP = null;
function idb() {
  if (!idbP) idbP = new Promise((res, rej) => {
    const r = indexedDB.open('sd-fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fotos');

}

  const db = await idb();
  await new Promise((res, rej) => {
    const tx = db.transaction('fotos', 'readwrite'); tx.objectStore('fotos').put(blob, id);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
async function fotoGet(id) {
  const db = await idb();
  return new Promise((res, rej) => { const r = db.transaction('fotos').objectStore('fotos').get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); });
}
async function fotoDel(id) {
  try { const db = await idb(); db.transaction('fotos', 'readwrite').objectStore('fotos').delete(id); } catch {}
  const u = urlCache.get(id); if (u) { URL.revokeObjectURL(u); urlCache.delete(id); }
}

  const u = URL.createObjectURL(b); urlCache.set(id, u); return u;
}

async function compress(fileOrBlob, max = 1600, q = 0.82) {
  const url = URL.createObjectURL(fileOrBlob);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.naturalWidth * sc)); cv.height = Math.max(1, Math.round(img.naturalHeight * sc));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);

}

      onRemove ? el('button', { class: 'rm', type: 'button', 'aria-label': `Remover foto ${f.rotulo}`, onclick: () => onRemove(f) }, '×') : null));

}

/* =====================================================================
   Tela: novo atendimento (entrada do veículo)
   ===================================================================== */
function renderNew(placaRaw) {
  const placa = norm(placaRaw);
  if (!isValid(placa)) return go('#/placa');
  const existente = ativoDaPlaca(placa);
  if (existente) return go(`#/veiculo/${esc(existente.id)}`);
  const v = DB.veiculos[placa] || {};
  const anteriores = atendimentosDaPlaca(placa);
  const fotos = []; // {rotulo, blob, url}
  if (S.pending && S.pending.placa === placa && S.pending.blob) {
    fotos.push({ rotulo: 'Placa', blob: S.pending.blob, url: URL.createObjectURL(S.pending.blob) });
  }
  S.pending = null;

  const fDesc = el('input', { id: 'f-desc', type: 'text', maxlength: '80', placeholder: 'Ex.: Strada branca 2022', value: v.descricao || '' });
  const tiposOk = DB.tipos.filter(t => t.etapas.length);
  const fTipo = el('select', { id: 'f-tipo' }, tiposOk.map(t => el('option', { value: t.id }, t.nome)));
  const fDanos = el('textarea', { id: 'f-danos', rows: '3', maxlength: '1000', placeholder: 'Riscos, amassados, peças soltas, problemas já existentes' });
  const fObj = el('textarea', { id: 'f-obj', rows: '2', maxlength: '600', placeholder: 'Objetos deixados no veículo' });
  const fValor = el('input', { id: 'f-valor', type: 'text', inputmode: 'decimal', placeholder: '0,00', autocomplete: 'off' });
  const fotosBox = el('div');
  const drawFotos = () => fotosBox.replaceChildren(photoGrid({
    items: fotos, slots: ROTULOS,
    onAdd: async rotulo => {
      const file = await pickPhoto(); if (!file) return;
      try {
        const blob = await compress(file);
        const i = ROTULOS.includes(rotulo) ? fotos.findIndex(f => f.rotulo === rotulo) : -1;
        const item = { rotulo, blob, url: URL.createObjectURL(blob) };
        if (i >= 0) { URL.revokeObjectURL(fotos[i].url); fotos[i] = item; } else fotos.push(item);
        drawFotos();
      } catch { toast('Não consegui abrir essa foto.', true); }
    },
    onRemove: f => { URL.revokeObjectURL(f.url); fotos.splice(fotos.indexOf(f), 1); drawFotos(); },
  }));
  drawFotos();

  const salvar = el('button', { class: 'btn btn--primary btn--lg btn--block', type: 'button' }, 'Iniciar serviço');
  salvar.addEventListener('click', async () => {
    const tipo = tipoById(fTipo.value);
    if (!tipo) { toast('Cadastre um tipo de serviço com etapas em Ajustes.', true); return; }
    let valor = null;
    if (isCtrl() && fValor.value.trim()) { valor = parseNum(fValor.value); if (isNaN(valor)) { toast('Valor inválido.', true); return; } }
    salvar.disabled = true; salvar.textContent = 'Salvando…';
    const fotosMeta = [];
    try {
      for (const f of fotos) { const id = uid(); await fotoPut(id, f.blob); fotosMeta.push({ id, rotulo: f.rotulo, em: Date.now() }); }
    } catch {
      for (const f of fotosMeta) fotoDel(f.id);
      salvar.disabled = false; salvar.textContent = 'Iniciar serviço';
      toast('Não foi possível salvar as fotos neste aparelho.', true); return;
    }
    const u = me();
    const at = {
      id: uid(), placa, tipoId: tipo.id, tipoNome: tipo.nome, etapas: [...tipo.etapas], etapaIndex: 0, feitas: {},
      concluido: false, concluidoEm: null, criadoEm: Date.now(), criadoPorNome: u.nome,
      danos: fDanos.value.trim(), objetos: fObj.value.trim(), valor, fotos: fotosMeta, historico: [],
    };
    registrar(at, 'Entrada do veículo');
    const ok = commit(() => {
      DB.veiculos[placa] = { ...(DB.veiculos[placa] || { criadoEm: Date.now() }), placa, descricao: fDesc.value.trim() };
      DB.atendimentos.push(at);
    });
    for (const f of fotos) URL.revokeObjectURL(f.url);
    if (!ok) { for (const f of fotosMeta) fotoDel(f.id); salvar.disabled = false; salvar.textContent = 'Iniciar serviço'; return; }
    toast('Serviço iniciado.');
    go(`#/veiculo/${esc(at.id)}`);
  });

  const body = el('div', { class: 'stack', style: 'max-width:640px' },
    backLink('#/placa', 'Ler outra placa'),
    el('div', { class: 'veh-head' },
      el('span', { class: 'veh-plate', text: fmtPlaca(placa) }),
      el('span', { class: 'veh-sub', text: anteriores.length ? `Veículo já atendido ${anteriores.length} ${anteriores.length === 1 ? 'vez' : 'vezes'}. Último serviço em ${fmtData(anteriores[0].criadoEm)}.` : 'Novo veículo. Registre a entrada.' })),
    el('div', { class: 'card' },
      el('h2', { text: 'Serviço' }),
      el('div', { class: 'field' }, el('label', { for: 'f-tipo', text: 'Tipo de serviço' }),
        tiposOk.length ? fTipo : el('p', { class: 'hint', text: 'Nenhum tipo de serviço com etapas. O Controle cadastra em Ajustes.' })),
      el('div', { class: 'field' }, el('label', { for: 'f-desc', text: 'Veículo' }), fDesc),
      isCtrl() ? el('div', { class: 'field' }, el('label', { for: 'f-valor', text: 'Valor do serviço (R$)' }), fValor) : null),
    el('div', { class: 'card' },
      el('div', { class: 'card-head' }, el('h2', { text: 'Fotos de entrada' }), el('span', { class: 'hint', text: 'Toque para fotografar' })),
      fotosBox),
    el('div', { class: 'card' },
      el('h2', { text: 'Estado na entrada' }),
      el('div', { class: 'field' }, el('label', { for: 'f-danos', text: 'Danos ou problemas' }), fDanos),
      el('div', { class: 'field' }, el('label', { for: 'f-obj', text: 'Objetos pessoais no veículo' }), fObj)),
    salvar);
  shell(body, { current: 'placa' });
}

/* =====================================================================
   Tela: estoque
   Funcionário registra retirada. Controle registra entrada, contagem e mínimo.
   ===================================================================== */
function renderStock() {
  const ctrl = isCtrl(), u = me();
  const itens = DB.estoque.itens;
  const cards = itens.map(it => {
    const s = saldo(it.id), sit = situacao(it);
    const ult = DB.estoque.movimentos.filter(m => m.itemId === it.id && m.tipo === 'saida').slice(-1)[0];
    const open = S.stockOpen && S.stockOpen.itemId === it.id ? S.stockOpen.mode : null;
    const toggle = mode => { S.stockOpen = open === mode ? null : { itemId: it.id, mode }; renderStock(); };

    let form = null;
    if (open) {
      const qInit = open === 'ajuste' ? fmtQ(Math.max(0, s)) : open === 'minimo' ? fmtQ(it.minimo) : '1';
      const q = el('input', { type: 'text', inputmode: 'decimal', value: qInit, autocomplete: 'off', 'aria-label': 'Quantidade' });
      const bump = d => { const n = parseNum(q.value); q.value = fmtQ(Math.max(0, (isNaN(n) ? 0 : n) + d)); };
      const obs = el('input', { type: 'text', maxlength: '120', placeholder: open === 'entrada' ? 'Nota, fornecedor (opcional)' : 'Observação (opcional)' });
      const label = { saida: 'Confirmar retirada', entrada: 'Registrar entrada', ajuste: 'Salvar contagem', minimo: 'Salvar mínimo' }[open];
      const confirm = el('button', { class: 'btn btn--primary grow', type: 'button', onclick: () => {
        const n = parseNum(q.value);
        if (isNaN(n) || (open !== 'ajuste' && open !== 'minimo' && n <= 0)) { toast('Informe uma quantidade válida.', true); return; }
        let msg = '';
        const ok = commit(() => {
          if (open === 'saida') { movimentar(it.id, 'saida', -n, obs.value.trim()); msg = `Retirada registrada: ${fmtQ(n)} ${it.unidade}.`; }
          else if (open === 'entrada') { movimentar(it.id, 'entrada', n, obs.value.trim()); msg = `Entrada registrada: ${fmtQ(n)} ${it.unidade}.`; }
          else if (open === 'ajuste') { const d = round2(n - saldo(it.id)); if (d !== 0) movimentar(it.id, 'ajuste', d, obs.value.trim() || 'Contagem'); msg = d === 0 ? 'Contagem confere com o saldo.' : 'Saldo corrigido pela contagem.'; }
          else if (open === 'minimo') { it.minimo = n; msg = n > 0 ? `Aviso quando chegar a ${fmtQ(n)} ${it.unidade}.` : 'Mínimo removido.'; }
        });
        if (ok) { S.stockOpen = null; toast(msg); renderStock(); }
      } }, label);
      form = el('div', { class: 'inline-form' },
        el('span', { class: 'label', text: { saida: `Quantas ${it.unidade}s você retirou?`, entrada: `Quantas ${it.unidade}s entraram?`, ajuste: `Quantas ${it.unidade}s tem agora? (contagem física)`, minimo: `Avisar quando chegar a quantas ${it.unidade}s?` }[open] }),
        el('div', { class: 'stepper' },
          el('button', { type: 'button', 'aria-label': 'Menos', onclick: () => bump(-1) }, '−'), q,
          el('button', { type: 'button', 'aria-label': 'Mais', onclick: () => bump(1) }, '+')),
        open === 'minimo' ? null : obs,
        el('div', { class: 'actions' }, confirm, el('button', { class: 'btn', type: 'button', onclick: () => toggle(open) }, 'Cancelar')));
    }
    const actions = el('div', { class: 'actions' },
      el('button', { class: 'btn grow' + (ctrl ? '' : ' btn--primary'), type: 'button', 'aria-expanded': open === 'saida', onclick: () => toggle('saida') }, 'Retirar'),
      ctrl ? el('button', { class: 'btn grow btn--primary', type: 'button', 'aria-expanded': open === 'entrada', onclick: () => toggle('entrada') }, 'Entrada') : null);
    const ctrlLinks = ctrl ? el('div', { class: 'actions', style: 'gap:14px' },
      el('button', { class: 'link-btn', type: 'button', onclick: () => toggle('ajuste') }, 'Contagem'),
      el('button', { class: 'link-btn', type: 'button', onclick: () => toggle('minimo') }, 'Estoque mínimo')) : null;
    return el('li', { class: 'item' + (sit.k === 'low' ? ' is-low' : sit.k !== 'ok' ? ' is-out' : '') },
      el('div', { class: 'item-top' },
        el('div', { style: 'display:grid;gap:4px' },
          el('span', { class: 'item-name', text: it.nome }),
          sit.txt ? el('span', {}, el('span', { class: 'tag ' + sit.cls, text: sit.txt })) : null,
          el('span', { class: 'item-min', text: it.minimo > 0 ? `Mínimo: ${fmtQ(it.minimo)} ${it.unidade}` : ctrl ? 'Sem mínimo definido' : '' })),
        el('span', { class: 'item-qty' }, fmtQ(s), ' ', el('small', { text: it.unidade }))),
      ult ? el('span', { class: 'item-last', text: `Última retirada: ${fmtQ(-ult.delta)} ${it.unidade}, ${ult.porId === (u && u.id) ? 'você' : ult.porNome}, ${ago(ult.em)}` }) : null,
      sit.k === 'neg' && ctrl ? el('span', { class: 'item-last', style: 'color:var(--danger)', text: 'Retiraram mais do que entrou. Falta registrar uma entrada ou fazer contagem.' }) : null,
      actions, ctrlLinks, form);

  const movs = DB.estoque.movimentos.filter(m => ctrl || m.porId === (u && u.id)).slice(-40).reverse();
  const tipoTxt = { entrada: 'Entrada', saida: 'Retirada', ajuste: 'Contagem' };
  const movList = movs.length ? el('ul', { class: 'log' }, movs.map(m => {

      el('span', { text: `${ctrl ? m.porNome + ' · ' : ''}${fmtDataHora(m.em)}` }));

  let novo = null;

      el('div', {}, el('button', { class: 'btn', type: 'button', onclick: () => {
        const nome = n.value.trim(); if (!nome) { toast('Digite o nome do material.', true); return; }
        if (itens.some(x => x.nome.toLowerCase() === nome.toLowerCase())) { toast('Esse material já existe.', true); return; }
        if (commit(() => DB.estoque.itens.push({ id: uid(), nome, unidade: un.value.trim() || 'un', minimo: 0 }))) { toast('Material adicionado.'); renderStock(); }
      } }, 'Adicionar material')));
  }

  const alertas = itensEmAlerta();
  const body = el('div', { class: 'stack-lg' },
    el('div', { class: 'stack' },
      el('div', { class: 'page-head' }, el('h1', { text: 'Estoque' }), alertas.length ? el('span', { class: 'tag tag--warn', text: `${alertas.length} ${alertas.length === 1 ? 'aviso' : 'avisos'}` }) : null),
      el('p', { class: 'hint', text: ctrl ? 'Entradas e contagens são do Controle. As retiradas dos funcionários aparecem no histórico abaixo.' : 'Registre aqui cada material que você pegar.' }),
      itens.length ? el('ul', { class: 'stock' }, cards) : el('p', { class: 'empty', text: 'Nenhum material cadastrado.' })),
    el('div', { class: 'card' }, el('h2', { text: ctrl ? 'Movimentos' : 'Suas retiradas' }), movList),
    novo);
  shell(body, { current: 'estoque' });
}

   Tela: histórico (Controle)
   ===================================================================== */

  const list = el('ul', { class: 'rows' });
  const empty = el('p', { class: 'empty' });
  const draw = () => {
    const q = S.histQuery.trim().toLowerCase(), q2 = norm(q);
    const items = !q ? all : all.filter(a => (q2 && a.placa.includes(q2)) || [(DB.veiculos[a.placa] || {}).descricao, a.tipoNome].join(' ').toLowerCase().includes(q));
    list.replaceChildren(...items.map(a => {
      const capa = capaDe(a), v = DB.veiculos[a.placa] || {};
      return el('li', {}, el('a', { class: 'r', href: `#/veiculo/${esc(a.id)}`, style: 'color:inherit;text-decoration:none' },
        el('span', { class: 'r-thumb' }, capa ? photoImg(capa, '') : null),
        el('span', { class: 'r-main' }, el('span', { class: 'r-plate', text: fmtPlaca(a.placa) }), el('span', { class: 'r-sub', text: [v.descricao, a.tipoNome].filter(Boolean).join(' · ') })),
        el('span', { class: 'r-side' }, el('div', { text: a.concluidoEm ? fmtData(a.concluidoEm) : '' }), a.valor != null ? el('div', { style: 'color:var(--ink);font-weight:600', text: fmtBRL(a.valor) }) : null)));
    }));
    list.hidden = !items.length; empty.hidden = !!items.length;
    empty.textContent = all.length ? 'Nada encontrado.' : 'Nenhum serviço concluído ainda.';
  };
  const body = el('div', { class: 'stack', style: 'max-width:720px' },
    el('div', { class: 'page-head' }, el('h1', { text: 'Histórico' }), el('span', { class: 'count', text: all.length ? `${all.length} concluídos` : '' })),
    el('div', { class: 'search' }, icon('search'), el('input', { type: 'search', placeholder: 'Buscar placa ou veículo', value: S.histQuery, 'aria-label': 'Buscar no histórico', oninput: e => { S.histQuery = e.target.value; draw(); } })),
    list, empty);
  shell(body, { current: 'historico' });
  draw();
}

/* =====================================================================
   Tela: ajustes (Controle): tipos de serviço, equipe, backup
   ===================================================================== */
function renderSettings() {
  const redraw = () => { const y = window.scrollY; renderSettings(); window.scrollTo(0, y); };
  const tipos = DB.tipos.map(t => {
    const emUso = DB.atendimentos.some(a => a.tipoId === t.id && !a.concluido);
    const add = el('input', { type: 'text', maxlength: '60', placeholder: 'Nova etapa' });
    const addEtapa = () => { const v = add.value.trim(); if (!v) return; if (commit(() => t.etapas.push(v))) redraw(); };
    add.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addEtapa(); } });
    const move = (i, d) => commit(() => { const [x] = t.etapas.splice(i, 1); t.etapas.splice(i + d, 0, x); }) && redraw();
    return el('div', { class: 'card' },
      el('div', { class: 'card-head' },
        el('h3', { text: t.nome }),
        el('button', { class: 'btn btn--sm btn--danger', type: 'button', onclick: () => {
          if (!window.confirm(`Excluir o tipo de serviço "${t.nome}"? Atendimentos já feitos não são afetados.`)) return;
          if (commit(() => { DB.tipos = DB.tipos.filter(x => x.id !== t.id); })) redraw();
        } }, 'Excluir')),
      emUso ? el('p', { class: 'hint', text: 'Mudanças nas etapas valem para os próximos serviços. Os que estão em andamento seguem a lista de quando começaram.' }) : null,
      el('ol', { class: 'etapas' }, t.etapas.map((nome, i) => el('li', {},
        el('span', { class: 'n', text: String(i + 1) }), el('span', { class: 't', text: nome }),
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': `Subir ${nome}`, disabled: i === 0, onclick: () => move(i, -1) }, icon('up')),
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': `Descer ${nome}`, disabled: i === t.etapas.length - 1, onclick: () => move(i, 1) }, icon('down')),
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': `Remover ${nome}`, onclick: () => commit(() => t.etapas.splice(i, 1)) && redraw() }, '×')))),
      el('div', { class: 'row' }, add, el('button', { class: 'btn', type: 'button', style: 'flex:none', onclick: addEtapa }, 'Adicionar')));
  });
  const novoTipo = el('input', { type: 'text', maxlength: '60', placeholder: 'Ex.: Higienização interna' });

  const u = me();
  const equipe = el('ul', { class: 'rows' }, DB.funcionarios.slice().sort((a, b) => a.nome.localeCompare(b.nome)).map(f => {
    const nivel = el('select', { 'aria-label': `Nível de ${f.nome}`, style: 'width:auto;font-size:14px;padding:8px 32px 8px 10px', disabled: f.id === u.id },
      el('option', { value: 'funcionario', selected: f.nivel === 'funcionario' }, 'Funcionário'),
      el('option', { value: 'controle', selected: f.nivel === 'controle' }, 'Controle'));
    nivel.addEventListener('change', () => commit(() => { f.nivel = nivel.value; }) && toast('Nível alterado.'));
    return el('li', {}, el('div', { class: 'r' },
      el('span', { class: 'r-main' }, el('span', { class: 'r-title', text: f.nome + (f.id === u.id ? ' (você)' : '') })),
      nivel,
      f.id === u.id ? null : el('button', { class: 'icon-btn', type: 'button', 'aria-label': `Remover ${f.nome}`, onclick: () => {
        if (!window.confirm(`Remover ${f.nome}? O histórico com o nome dele continua registrado.`)) return;
        if (commit(() => { DB.funcionarios = DB.funcionarios.filter(x => x.id !== f.id); })) redraw();
      } }, '×')));
  }));
  const nNome = el('input', { type: 'text', maxlength: '60', placeholder: 'Nome' });
  const nNivel = el('select', {}, el('option', { value: 'funcionario' }, 'Funcionário'), el('option', { value: 'controle' }, 'Controle'));

  const body = el('div', { class: 'stack-lg', style: 'max-width:720px' },
    el('h1', { text: 'Ajustes' }),
    el('section', { class: 'stack' },
      el('h2', { text: 'Tipos de serviço e etapas' }),
      ...tipos,
      el('div', { class: 'card' }, el('h3', { text: 'Novo tipo de serviço' }),
        el('div', { class: 'row' }, novoTipo, el('button', { class: 'btn btn--primary', type: 'button', style: 'flex:none', onclick: () => {
          const nome = novoTipo.value.trim(); if (!nome) { toast('Digite o nome.', true); return; }
          if (commit(() => DB.tipos.push({ id: uid(), nome, etapas: [] }))) { toast('Tipo criado. Agora adicione as etapas.'); redraw(); }
        } }, 'Criar')))),
    el('section', { class: 'stack' },
      el('h2', { text: 'Equipe' }),
      equipe,
      el('div', { class: 'card' }, el('h3', { text: 'Adicionar pessoa' }),
        el('div', { class: 'row' }, nNome, el('div', { style: 'flex:.7' }, nNivel)),
        el('div', {}, el('button', { class: 'btn btn--primary', type: 'button', onclick: () => {
          const nome = nNome.value.trim(); if (!nome) { toast('Digite o nome.', true); return; }
          if (commit(() => DB.funcionarios.push({ id: uid(), nome, nivel: nNivel.value }))) { toast('Pessoa adicionada.'); redraw(); }
        } }, 'Adicionar')))),
    el('section', { class: 'stack' },
      el('h2', { text: 'Dados' }),
      el('div', { class: 'card' },
        el('p', { class: 'hint', text: 'Tudo fica salvo neste navegador. Faça um backup de vez em quando (as fotos não entram no arquivo).' }),
        el('div', {}, el('button', { class: 'btn', type: 'button', onclick: () => {
          const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
          const a = el('a', { href: URL.createObjectURL(blob), download: `strike-details-backup-${new Date().toISOString().slice(0, 10)}.json` });
          document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        } }, 'Baixar backup (JSON)')))));
  shell(body, { current: 'ajustes' });
}

/* =====================================================================
   Tela: cliente (só placa, andamento e fotos)
   ===================================================================== */
function renderClient(placaRaw) {
  const placa = norm(placaRaw || '');
  const input = el('input', { class: 'plate-input', type: 'text', maxlength: '8', placeholder: 'ABC1D23', value: placa, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', enterkeyhint: 'go', 'aria-label': 'Placa do veículo' });
  const buscar = () => {
    const p = norm(input.value);
    if (!isValid(p)) { toast('Placa inválida. São 7 caracteres, como ABC1D23.', true); input.focus(); return; }
    go(`#/cliente/${esc(p)}`);
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); buscar(); } });

  let result = null;
  if (placa) {
    const at = ativoDaPlaca(placa) || atendimentosDaPlaca(placa)[0];
    if (!at) {
      result = el('p', { class: 'empty', text: `Não encontramos serviço para a placa ${fmtPlaca(placa)}. Confira a placa ou fale com a Strike Details.` });
    } else {
      const v = DB.veiculos[at.placa] || {};
      const pct = Math.round(progresso(at) * 100);
      result = el('div', { class: 'stack' },
        el('div', { class: 'veh-head' },
          el('span', { class: 'veh-plate', text: fmtPlaca(at.placa) }),
          el('span', { class: 'veh-sub', text: [v.descricao, at.tipoNome].filter(Boolean).join(' · ') })),
        el('div', { class: 'status-big' },
          el('span', { class: 'k', text: at.concluido ? 'SERVIÇO CONCLUÍDO' : 'ETAPA ATUAL' }),
          el('span', { class: 'v', text: at.concluido ? 'Pronto' : at.etapas[at.etapaIndex] }),
          el('div', { class: 'bar' }, el('i', { style: `width:${pct}%` }))),
        el('div', { class: 'card' }, el('h2', { text: 'Andamento' }),
          el('ol', { class: 'steps' }, at.etapas.map((nome, i) => {
            const done = at.concluido || i < at.etapaIndex, cur = !at.concluido && i === at.etapaIndex;
            return el('li', { class: 'step ' + (done ? 'is-done' : cur ? 'is-current' : 'is-todo') },
              el('span', { class: 'step-dot' }, done ? icon('check') : null),
              el('span', { class: 'step-name', text: nome }),
              el('span', { class: 'step-when', text: at.feitas[i] ? fmtData(at.feitas[i]) : cur ? 'Em andamento' : '' }));
          }))),
        at.fotos.length ? el('div', { class: 'card' }, el('h2', { text: 'Fotos' }), photoGrid({ items: at.fotos })) : null);
    }
  }
  const body = el('div', { class: 'client stack-lg' },
    el('div', { class: 'client-hero' }, el('h1', { text: 'Acompanhe seu veículo' }), el('p', { text: 'Digite a placa para ver o andamento do serviço e as fotos.' })),
    el('div', { class: 'row' }, input, el('button', { class: 'btn btn--primary', type: 'button', style: 'flex:none', onclick: buscar }, 'Ver andamento')),
    result);
  shell(body, { nav: false });
}

/* ---------- Início ---------- */
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); });
route();

// Só para testes automatizados; não afeta o uso normal.
window.__sd = { norm, isValid, fixByPosition, extractPlates, saldo, get DB() { return DB; } };
})();
</script>
